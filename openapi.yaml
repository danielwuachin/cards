openapi: 3.0.3
info:
  title: Cards API
  description: >
    Create and look up credit cards. PANs are encrypted at rest (AES-256-GCM)
    and never returned in full — every response masks to `**** **** **** 1234`.
  version: '2.0.0'
servers:
  - url: https://api.danviviendo.com
    description: Production
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: Cards
  - name: Health

paths:
  /cards:
    post:
      tags: [Cards]
      summary: Create a card
      description: >
        Requires `Idempotency-Key`. The same key + same body replays the
        original response instead of creating a second card; the same key
        with a different body is rejected.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: Client-generated unique string (a UUID is the usual choice).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
            example:
              pan: '4532015112830366'
              expirationMonth: 12
              expirationYear: 2030
              holderName: DANIEL SERGIO
      responses:
        '201':
          description: Card created (or replayed from a prior identical request).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: >
            Validation failure (bad PAN/Luhn, expired date, malformed body),
            missing `Idempotency-Key`, or the same key reused with a
            different body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A request with this Idempotency-Key is already in progress.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      tags: [Cards]
      summary: List cards (cursor pagination)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
          description: Opaque `nextCursor`/`prevCursor` value from a previous page.
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '400':
          description: Invalid `limit`, `order`, or corrupted `cursor`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards/{id}:
    get:
      tags: [Cards]
      summary: Get a card by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: `id` is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No card with that ID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /cards:search:
    get:
      tags: [Cards]
      summary: Search by last 4 digits
      description: >
        Rate-limited to ~30 requests/minute per IP via an AWS WAF rule on the
        ALB, not the app (`last4` only has 10,000 possible values, so
        unrestricted search is a card-enumeration side channel).
        `GET /cards/search?last4=` works identically.
      parameters:
        - in: query
          name: last4
          required: true
          schema:
            type: string
            pattern: '^\d{4}$'
      responses:
        '200':
          description: Cards matching the given last 4 digits (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: '`last4` is not exactly 4 numeric digits.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: >
            Rate limit exceeded. Returned by the AWS WAF rule on the ALB —
            the request never reaches the app.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      description: >
        Shallow — no database call. This is the endpoint wired to the ALB
        target group, so a slow database never takes healthy instances out
        of rotation.
      responses:
        '200':
          description: Instance is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveness'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: Deep — runs `SELECT 1` against Postgres.
      responses:
        '200':
          description: Instance is up and can reach the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
        '500':
          description: Instance is up but cannot reach the database.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    CreateCardRequest:
      type: object
      required: [pan, expirationMonth, expirationYear, holderName]
      properties:
        pan:
          type: string
          description: 13-19 digit PAN, must pass the Luhn checksum.
          example: '4532015112830366'
        expirationMonth:
          type: integer
          minimum: 1
          maximum: 12
        expirationYear:
          type: integer
          minimum: 2000
          maximum: 2100
        holderName:
          type: string
          minLength: 1
          maxLength: 100

    Card:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 — sortable by creation time.
        pan:
          type: string
          description: Always masked. The full PAN is never returned by any endpoint.
          example: '**** **** **** 0366'
        expirationMonth:
          type: integer
        expirationYear:
          type: integer
        holderName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CardList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        pagination:
          type: object
          properties:
            limit:
              type: integer
            nextCursor:
              type: string
              nullable: true
            prevCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean

    HealthLiveness:
      type: object
      properties:
        status:
          type: string
          example: OK
        instanceId:
          type: string
          description: Hostname/IP of the ECS task that answered — differs across replicas.

    HealthReadiness:
      allOf:
        - $ref: '#/components/schemas/HealthLiveness'
        - type: object
          properties:
            database:
              type: string
              example: connected

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details — every error response uses this shape.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
