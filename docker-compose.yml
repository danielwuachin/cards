version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cards_postgres_db
    environment:
      POSTGRES_DB: db_cards_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d db_cards_test']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cards_express_app
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_cards_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      CARD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      HOSTNAME: ecs-container-replica-01
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
